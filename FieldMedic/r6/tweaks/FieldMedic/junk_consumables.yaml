# FieldMedic — Convert passive junk items into improvised consumables.
#

# Custom base effects
FieldMedic.Health_StatsPackageBonus_Low:
  $type: gamedataConstantStatModifier_Record
  value: 1.1
  modifierType: Multiplier
  statType: BaseStats.Health

FieldMedic.Health_StatsPackageBonus_Mid:
  $type: gamedataConstantStatModifier_Record
  value: 1.3
  modifierType: Multiplier
  statType: BaseStats.Health

FieldMedic.Stamina_StatsPackageBonus_Low:
  $type: gamedataConstantStatModifier_Record
  value: 1.1
  modifierType: Multiplier
  statType: BaseStats.Stamina

FieldMedic.Stamina_StatsPackageDamage_Mid:
  $type: gamedataConstantStatModifier_Record
  value: 0.80
  modifierType: Multiplier
  statType: BaseStats.Stamina

# Item weight is a stat (BaseStats.Weight) read from the item's own statModifiers list —
# NOT the `mass` field (that's a physics/visual property only). Applied via statModifiers:,
# not OnEquip: (OnEquip only buffs the player, it doesn't set the item's own stats).
FieldMedic.Weight_Light:
  $type: gamedataConstantStatModifier_Record
  value: 0.1
  modifierType: Additive
  statType: BaseStats.Weight

# OnEquip only accepts GameplayLogicPackage_Record refs, not raw stat modifiers directly —
# wrap each stat modifier combo in a package so the game actually applies it on consume.
FieldMedic.GLP_MedicalGauze:
  $type: GameplayLogicPackage_Record
  stats:
    - FieldMedic.Health_StatsPackageBonus_Low

FieldMedic.GLP_AntisepticDisinfectant:
  $type: GameplayLogicPackage_Record
  stats:
    - FieldMedic.Health_StatsPackageBonus_Mid

FieldMedic.GLP_Bubblegum:
  $type: GameplayLogicPackage_Record
  stats:
    - FieldMedic.Stamina_StatsPackageBonus_Low

FieldMedic.GLP_BloodyBandage:
  $type: GameplayLogicPackage_Record
  stats:
    - FieldMedic.Health_StatsPackageBonus_Mid
    - FieldMedic.Stamina_StatsPackageDamage_Mid

# --- Medical Gauze (FieldMedic clone) -------------------------------------------------------
# Slow heal-over-time bandage. Cloned from BounceBack L1 so it inherits objectActions,
# gameplayLogicPackage, animations, and the Consume flow. Name/description come from the
# vanilla junk record at runtime (see FieldMedic.reds UI wraps).
Items.FieldMedic_MedicalGauze:
  $base: Items.HealthBooster
  itemCategory: ItemCategory.Consumable
  itemType: ItemType.Con_LongLasting
  displayName: LocKey#4947
  iconPath: "MedicalGauze" 
  localizedDescription: Gameplay-Misc-Junk-DisplayName-GenericJunkItem4
  mass: 0.1
  statModifiers:
    - FieldMedic.Weight_Light
  tags:
    - Consumable
    - Edible
    - Medical
    - FieldMedic
    - FieldMedic_Bandage
  CraftingData:
    $type: CraftingPackage_Record
    craftingExpModifier: 1
    overcraftPenaltyModifier: 1
    craftingRecipe:
      - $type: RecipeElement_Record
        amount: 1
        ingredient: Items.FieldMedic_BloodyBandage
      - $type: RecipeElement_Record
        amount: 1
        ingredient: Items.FieldMedic_AntisepticDisinfectant
  OnEquip:
    - FieldMedic.GLP_MedicalGauze

# --- Antiseptic Disinfectant (FieldMedic clone) ---------------------------------------------
# Instant status cleanser. Cloned from a first-aid medkit so it inherits the Consume flow.
# iconPath overrides the base medkit icon so the backpack shows the disinfectant bottle
# rather than a health injector.
Items.FieldMedic_AntisepticDisinfectant:
  $base: Items.HealthBooster
  itemCategory: ItemCategory.Consumable
  itemType: ItemType.Con_LongLasting
  displayName: LocKey#4964
  iconPath: "hygenic_bag"
  mass: 0.1
  statModifiers:
    - FieldMedic.Weight_Light
  tags:
    - Consumable
    - Edible
    - Medical
    - FieldMedic
    - FieldMedic_Antiseptic
    - CraftingMaterial
  dropObject: defaultItemDrop 
  OnEquip:
    - FieldMedic.GLP_AntisepticDisinfectant
  
# --- Bloody Bandage -------------------------------------------------------------------------
# Emergency heal — clears Bleeding and restores a small flat chunk of health, but has a
# chance of applying Poisoned (infection risk).
Items.FieldMedic_BloodyBandage:
  $type: ConsumableItem_Record
  $base: Items.HealthBooster
  itemCategory: ItemCategory.Consumable
  itemType: ItemType.Con_LongLasting
  quality: Quality.Common
  displayName: LocKey#5024
  localizedDescription: Gameplay-Misc-Junk-DisplayName-GenericCorporationJunkItem3
  iconPath: "bloody_bandage"
  mass: 0.1
  statModifiers:
    - FieldMedic.Weight_Light
  tags:
    - Consumable
    - Edible
    - Medical
    - FieldMedic
    - FieldMedic_Bandage
    - FieldMedic_Risky
    - CraftingMaterial
  dropObject: defaultItemDrop
  OnEquip:
    - FieldMedic.GLP_BloodyBandage

# Bubblegum
# Items.GenericJunkItem29:  
# Items.GenericJunkItem30:   
Items.FieldMedic_Bubblegum:
  $base: Items.HealthBooster
  itemCategory: ItemCategory.Consumable
  itemType: ItemType.Con_LongLasting
  displayName: LocKey#45749
  iconPath: "gum_b_GenericJunkItem30" 
  localizedDescription: Gameplay-Misc-Junk-LocalizedDescription-GenericJunkItem30
  mass: 0.1
  statModifiers:
    - FieldMedic.Weight_Light
  tags:
    - Consumable
    - Edible
    - Medical
    - FieldMedic
    - FieldMedic_Bubblegum
  OnEquip: 
    - FieldMedic.GLP_Bubblegum

# --- End of FieldMedic junk consumables ------------------------------------------------------

